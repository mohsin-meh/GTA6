<title>تحميل GTA 6 - رسمي</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');

  body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background: #0a0a0a;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: #fff;
  }

  /* الخلفية مع تأثير ضوئي متحرك */
  body::before {
    content: '';
    position: absolute;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 30%, rgba(255,204,0,0.1), transparent 70%);
    animation: lightMove 12s linear infinite;
    z-index: 0;
  }

  @keyframes lightMove {
    0% { transform: translate(0,0); }
    50% { transform: translate(-50px, 50px); }
    100% { transform: translate(0,0); }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 380px;
    border-radius: 20px;
    overflow: hidden;
    background: #111;
    box-shadow: 0 0 40px rgba(255,204,0,0.5);
    text-align: center;
    padding-bottom: 30px;
  }

  .container img.bg {
    width: 100%;
    display: block;
    filter: brightness(50%);
    transition: transform 1s;
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.02); }
  }

  .title {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Russo One', sans-serif;
    font-size: 36px;
    color: #ffcc00;
    text-shadow: 0 0 15px #ffcc00, 0 0 30px #ffcc00, 2px 2px 10px #000;
    animation: glow 1.8s ease-in-out infinite alternate;
  }

  @keyframes glow {
    0% { text-shadow: 0 0 10px #ffcc00, 0 0 20px #ffcc00; }
    100% { text-shadow: 0 0 20px #ffcc00, 0 0 40px #ffcc00; }
  }

  .logo {
    position: absolute;
    bottom: 75px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: translateX(-50%) scale(1); filter: drop-shadow(0 0 10px #ffcc00); }
    50% { transform: translateX(-50%) scale(1.05); filter: drop-shadow(0 0 20px #ffcc00); }
  }

  .progress-bar {
    width: 85%;
    height: 24px;
    background: #222;
    border-radius: 12px;
    margin: 30px auto 0;
    overflow: hidden;
    box-shadow: 0 0 15px #000 inset;
  }

  .progress {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ff0000, #ffcc00);
    position: relative;
    font-family: 'Russo One', sans-serif;
    font-weight: bold;
    color: #fff;
    line-height: 24px;
    text-align: center;
    overflow: hidden;
  }

  .progress::after {
    content: '';
    position: absolute;
    top: 0;
    left: -50%;
    width: 50%;
    height: 100%;
    background: rgba(255,255,255,0.4);
    transform: skewX(-25deg);
    animation: shine 2s linear infinite;
  }

  @keyframes shine {
    0% { left: -50%; }
    100% { left: 150%; }
  }

  button {
    display: none;
    margin-top: 20px;
    padding: 16px 32px;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(90deg, #ff0000, #ffcc00);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,204,0,0.5);
    transition: transform 0.3s, box-shadow 0.3s;
  }

  button:hover {
    transform: scale(1.1);
    box-shadow: 0 10px 25px rgba(255,204,0,0.8);
  }

</style>

<body>

<div class="container">
  <img class="bg" src="https://tse1.mm.bing.net/th/id/OIP.5uXl4lpmnagDGwNBcnxZtgHaEK?rs=1&pid=ImgDetMain&o=7&rm=3" alt="GTA Background">
  <div class="title">تحميل GTA 6 - رسمي</div>
  <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/3/3d/GTA_logo.png" alt="GTA Logo">

  <div class="progress-bar">
    <div class="progress" id="progress">0%</div>
  </div>

  <button id="downloadBtn">تحميل الآن</button>
</div>

<audio id="downloadSound" src="https://www.soundjay.com/button/sounds/button-16.mp3"></audio>

<script>
  let progressEl = document.getElementById('progress');
  let btn = document.getElementById('downloadBtn');
  let sound = document.getElementById('downloadSound');
  let width = 0;

  let interval = setInterval(() => {
    if(width >= 100){
      clearInterval(interval);
      btn.style.display = 'inline-block';
      sound.play();
    } else {
      width += Math.floor(Math.random() * 7) + 3;
      if(width > 100) width = 100;
      progressEl.style.width = width + '%';
      progressEl.textContent = width + '%';
    }
  }, 350);

  btn.addEventListener('click', () => {
    window.location.href = "https://example.com/gta6-download";
  });
</script>

</body>
